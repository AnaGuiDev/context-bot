<style>
@font-face{font-family:Nunito;font-style:normal;font-weight:200 1000;font-display:swap;src:url({{R}}assets/fonts/nunito-latin.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#0a0a1f;--bg-deep:#06061a;--card:rgba(255,255,255,.045);--card-solid:#141336;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--text:#f2f3ff;--muted:#b6bad9;--accent:#a5b4fc;--blue:#2563eb;--on:#1a1400;--g:#4ade80;--y:#facc15;--r:#f87171;--off:#272a44;--radius:22px;--shadow:0 30px 60px -30px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{background:var(--bg-deep);-webkit-text-size-adjust:100%}
body{margin:0;position:relative;isolation:isolate;min-height:100vh;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);line-height:1.6;
  background:radial-gradient(900px 520px at 85% -8%,rgba(139,92,246,.30),transparent 62%),radial-gradient(700px 480px at -12% 8%,rgba(37,99,235,.20),transparent 60%),linear-gradient(180deg,#151140 0,#0c0b29 520px,var(--bg) 1100px,var(--bg-deep) 100%)}
body::before{content:"";position:absolute;inset:0 0 auto;height:1100px;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--y);color:var(--on);font-weight:800;padding:10px 16px;border-radius:999px;z-index:100;text-decoration:none}
.skip:focus{top:12px}
.logo{display:inline-flex;gap:10px;align-items:center;font-weight:900;font-size:1.12rem;letter-spacing:-.01em;color:var(--text);text-decoration:none}
.logo svg{width:20px;height:34px;flex:none;filter:drop-shadow(0 0 8px rgba(250,204,21,.35))}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;font-size:.85rem;font-weight:800;background:rgba(0,0,0,.2)}
.lang a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;min-width:32px;text-align:center}
.lang a[aria-current]{background:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:900;font-size:1.04rem;line-height:1.2;text-decoration:none;cursor:pointer;border:0;border-radius:999px;padding:16px 26px;min-height:52px;background:var(--y);color:var(--on);box-shadow:0 12px 34px -12px rgba(250,204,21,.7),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px -12px rgba(250,204,21,.85),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn.alt{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.alt:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.btn svg{width:20px;height:20px;flex:none;fill:currentColor}
.btn .stars{font-weight:800;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
