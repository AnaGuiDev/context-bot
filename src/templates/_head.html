<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{URL}}">
<link rel="alternate" hreflang="en" href="{{URL_EN}}">
<link rel="alternate" hreflang="es" href="{{URL_ES}}">
<link rel="alternate" hreflang="x-default" href="{{URL_EN}}">
<script>
/* Idioma: respeta la elección guardada; si no hay, en la versión inglesa (por defecto) pasa a español cuando el navegador lo prefiere. */
(function(){try{var L=document.documentElement.lang,p=localStorage.getItem('cb-lang'),n=((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase();
var w=p||(L==='en'&&n.indexOf('es')===0?'es':L);if(w!==L){location.replace('{{ALT}}'+location.search+location.hash)}}catch(e){}})();
</script>
<meta name="theme-color" content="#151140">
<meta name="color-scheme" content="dark">
<meta name="author" content="Ana Gui">
<link rel="icon" href="{{R}}assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{R}}assets/brand/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Context Bot">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_locale_alt}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{DOMAIN}}/assets/brand/{{og_image}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@contextbotapp">
<meta name="twitter:creator" content="@SoyAnaDev">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{og_description}}">
<meta name="twitter:image" content="{{DOMAIN}}/assets/brand/{{og_image}}">
<meta name="twitter:image:alt" content="{{og_image_alt}}">
<link rel="preload" href="{{R}}assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
{{JSONLD}}
