# Publica en la cuenta controlada por el propietario; el cambio de dominio se realiza por separado.
# No crea el proyecto de Pages. Si no existe, el workflow falla.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '260a68d445569ce628932b896c94dbbe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Comprobar secretos de despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Generar dist/
        run: bash scripts/build-site.sh
      - name: Pruebas antes de publicar
        env:
          CB_OFFLINE: '1'
        run: |
          python3 tests/site-contract.py
          python3 tests/security-headers.py
          python3 worker/gen-tips.py --check
          node --test tests/*.cjs
          node --check src/js/dashboard.js
          node --check src/js/live.js
          git diff --check
      - name: Pruebas del worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Comprobar que el proyecto Pages ya existe
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          base = "https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects"
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
          def request(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  result = json.load(exc)
              if not result.get("success"):
                  raise SystemExit("Cloudflare: " + json.dumps(result.get("errors", [])))
              return result["result"]
          projects = request(base)
          project = next((p for p in projects if p["name"] == "context-bot"), None)
          if project is None:
              raise SystemExit("El proyecto Pages context-bot no existe. Este workflow no lo crea.")
          if project.get("production_branch") != "main":
              raise SystemExit("La rama de produccion del proyecto no es main")
          url = "https://" + project["subdomain"]
          print("Proyecto existente: " + url)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("url=" + url + "\n")
          PY
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=context-bot --branch=main
      - name: Verificar skills, script y contextbot.app
        env:
          SITE_URL: ${{ steps.project.outputs.url }}
        run: |
          check() {
            curl --fail --silent --show-error --max-time 30 "$1" -o /tmp/published-content && cmp -s "$2" /tmp/published-content
          }
          for attempt in 1 2 3 4 5 6; do
            matched=true
            for path in es/skill.md skill.md savings-scan.sh; do
              if ! check "$SITE_URL/$path?deploy=$GITHUB_SHA" "dist/$path"; then
                echo "Pendiente de verificar: $SITE_URL/$path"
                matched=false
              fi
            done
            if ! check "https://contextbot.app/?deploy=$GITHUB_SHA" dist/index.html; then
              echo "Pendiente de verificar: https://contextbot.app/"
              matched=false
            fi
            if "$matched"; then
              echo "Skills, script y https://contextbot.app/ coinciden con $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El contenido publicado no coincide con el commit"
          exit 1
