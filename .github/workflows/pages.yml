# Publica dist/ en el proyecto existente de Cloudflare Pages.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar secretos de despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Generar dist/
        run: bash scripts/build-site.sh
      - name: Verificar web y aislamiento de la demo
        run: |
          python3 tests/site-contract.py
          node --test tests/dashboard-demo.cjs
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=context-bot --branch=main
      - name: Verificar skill publicada
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 "https://contextbot.app/es/skill.md?deploy=$GITHUB_SHA" -o /tmp/published-skill.md && cmp -s skills/context-bot/SKILL.md /tmp/published-skill.md; then
              echo "Skill publicada verificada contra el commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El contenido publicado no coincide con la skill del commit"
          exit 1
