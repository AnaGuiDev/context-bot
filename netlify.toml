# Netlify: genera dist/ y lo publica. Las cabeceras están en src/static/_headers.
[build]
  command = "bash scripts/build-site.sh"
  publish = "dist"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/"
  status = 301

[[redirects]]
  from = "/es/dashboard"
  to = "/es/dashboard/"
  status = 301
