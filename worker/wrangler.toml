# Context Bot · conector de estado en directo (servidor MCP remoto)
# Guía de despliegue: ../docs/despliegue-worker.md
name = "context-bot-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Dominio propio. Se activa al desplegar (wrangler deploy).
routes = [{ pattern = "mcp.contextbot.app", custom_domain = true }]

[vars]
PUBLIC_URL = "https://mcp.contextbot.app"
# Solo para pruebas locales: "1" permite un inicio de sesión falso en localhost.
DEV_FAKE_LOGIN = "0"

# Secretos (wrangler secret put …): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "context_bot"
database_id = "TODO_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LATEST"
id = "8678c0158a2443faaa89080b27e4fe7f"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c2ec85d06e4b41a5a821a94a2b056c9e"

[triggers]
# Cada día a las 03:17 UTC borra el historial de más de 90 días.
crons = ["17 3 * * *"]
